name: NASA APOD Daily Update

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute NASA Script
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          # Verificação de segurança para o nome correto do arquivo
          if [ -f "nasa.py" ]; then
            python nasa.py
          else
            echo "Erro: Arquivo nasa.py não encontrado na raiz."
            exit 1
          fi

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update NASA APOD" || exit 0
          git push
