name: NASA Daily Update

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute NASA Script
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          # O comando agora chama nasa.py
          if [ -f "nasa.py" ]; then
            python nasa.py
          else
            echo "Erro: O arquivo nasa.py não foi encontrado na raiz do repositório."
            exit 1
          fi

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update NASA APOD" || exit 0
          git push
